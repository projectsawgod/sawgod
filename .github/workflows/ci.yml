name: CI

# Every push to main and every pull request builds and tests all platforms.
# v1.2.3 tags (v[0-9]*) draft SawGod releases; the vanilla tag drafts the one-time desktop-only release.
on:
  push:
    branches: [main]
    tags: ['v[0-9]*', 'vanilla']
  pull_request:
  workflow_dispatch:
    inputs:
      platforms:
        description: 'Which builds (lint always runs; it is cheap)'
        type: choice
        default: all
        options: [all, macos, windows, linux, android]
      version:
        description: 'Optional draft release tag (v1.1.0 or vanilla); select the matching existing tag as ref'
        type: string
        default: ''
      label:
        description: 'Optional version label for the builds only (e.g. 0.8.5), no release; ignored with version'
        type: string
        default: ''

permissions:
  contents: read

# A newer push to the same pull request replaces its running checks.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CMAKE_BUILD_PARALLEL_LEVEL: 4
  CTEST_PARALLEL_LEVEL: 4
  OPENBLAS_NUM_THREADS: 1
  OMP_NUM_THREADS: 1
  SAWGOD_PACKAGE_JOBS: 4

jobs:
  release-plan:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.plan.outputs.version }}
      release: ${{ steps.plan.outputs.release }}
      flavor: ${{ steps.plan.outputs.flavor }}
      build_version: ${{ steps.plan.outputs.build_version }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Validate tag and release request
        id: plan
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          REQUESTED_PLATFORMS: ${{ inputs.platforms }}
        run: python3 tools/release/workflow_version.py

  build-test:
    needs: release-plan
    if: inputs.platforms == '' || inputs.platforms == 'all' || inputs.platforms == 'linux'
    strategy:
      fail-fast: false
      matrix:
        # Linux only: the shipped Windows zip is the MinGW cross-build (windows-mingw-cross,
        # the same as tools/package.sh windows here); the native MSVC test job was dropped. Windows is tested
        # locally under Wine.
        include:
          - os: ubuntu-24.04
            preset: linux-release
            build: build/package-linux
    runs-on: ${{ matrix.os }}
    env:
      SAWGOD_RELEASE_VERSION: ${{ needs.release-plan.outputs.build_version || (needs.release-plan.outputs.release != 'true' && inputs.label) || '' }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/requirements.txt

      # Enhanced-music tables import numpy at configure time; text extraction needs Pillow.
      - name: Install tool requirements
        run: python -m pip install -r tools/requirements.txt

      - name: Install SDL3 build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxss-dev libxtst-dev \
            libxfixes-dev libxkbcommon-dev libwayland-dev wayland-protocols libdecor-0-dev \
            libegl1-mesa-dev libgl1-mesa-dev libdrm-dev libgbm-dev libasound2-dev libpulse-dev \
            libpipewire-0.3-dev libudev-dev libdbus-1-dev ninja-build

      - name: Cache FetchContent downloads
        uses: actions/cache@v6.1.0
        with:
          path: ${{ matrix.build }}/_deps
          key: ${{ matrix.os }}-${{ matrix.preset }}-deps-${{ hashFiles('CMakeLists.txt', 'tests/CMakeLists.txt') }}

      - name: Configure
        run: ${{ runner.os == 'Linux' && 'nice' || '' }} cmake --preset ${{ matrix.preset }} -B ${{ matrix.build }} -DSAWGOD_ENGLISH_FILL= -DSAWGOD_DEV_SOUNDFONT=

      - name: Build
        run: ${{ runner.os == 'Linux' && 'nice' || '' }} cmake --build ${{ matrix.build }} --config Release --parallel 4

      - name: Test
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: ${{ runner.os == 'Linux' && 'nice' || '' }} ctest --test-dir ${{ matrix.build }} -C Release --output-on-failure --parallel 4

      - name: Package Linux (reuse tested release build)
        if: runner.os == 'Linux'
        run: |
          if [[ "${{ needs.release-plan.outputs.flavor }}" == sawgod ]]; then
            python tools/release/fetch_soundfont.py
          fi
          nice tools/package.sh linux "${{ needs.release-plan.outputs.flavor }}"

      - uses: actions/upload-artifact@v7.0.2
        if: runner.os == 'Linux'
        with:
          name: sawgod-linux-x86_64
          path: |
            dist/${{ needs.release-plan.outputs.flavor == 'vanilla' && 'sawgod-vanilla' || 'sawgod' }}-linux-x86_64.tar.gz
            dist/${{ needs.release-plan.outputs.flavor == 'vanilla' && 'sawgod-vanilla' || 'sawgod' }}-linux-x86_64.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14

  windows-mingw-cross:
    needs: release-plan
    if: inputs.platforms == '' || inputs.platforms == 'all' || inputs.platforms == 'windows'
    runs-on: ubuntu-24.04
    env:
      SAWGOD_RELEASE_VERSION: ${{ needs.release-plan.outputs.build_version || (needs.release-plan.outputs.release != 'true' && inputs.label) || '' }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/requirements.txt

      - name: Install tool requirements
        run: python -m pip install -r tools/requirements.txt

      - name: Install mingw-w64 and Ninja
        run: sudo apt-get update && sudo apt-get install -y g++-mingw-w64-x86-64 ninja-build

      - name: Cache FetchContent downloads
        uses: actions/cache@v6.1.0
        with:
          path: build/package-windows/_deps
          key: windows-mingw-deps-${{ hashFiles('CMakeLists.txt', 'tests/CMakeLists.txt') }}

      - name: Build both desktop programs
        run: |
          nice cmake --preset windows-mingw -B build/package-windows -DSAWGOD_BUILD_TESTS=OFF -DSAWGOD_ENGLISH_FILL= -DSAWGOD_DEV_SOUNDFONT=
          nice cmake --build build/package-windows --target sawgod sawgod-vanilla --parallel 4

      - name: Package Windows (MinGW on Ubuntu)
        run: |
          if [[ "${{ needs.release-plan.outputs.flavor }}" == sawgod ]]; then
            python tools/release/fetch_soundfont.py
          fi
          nice tools/package.sh windows "${{ needs.release-plan.outputs.flavor }}"

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: sawgod-windows-x86_64
          path: |
            dist/${{ needs.release-plan.outputs.flavor == 'vanilla' && 'sawgod-vanilla' || 'sawgod' }}-windows-x86_64.zip
            dist/${{ needs.release-plan.outputs.flavor == 'vanilla' && 'sawgod-vanilla' || 'sawgod' }}-windows-x86_64.zip.sha256
          if-no-files-found: error
          retention-days: 14

  macos:
    if: inputs.platforms == '' || inputs.platforms == 'all' || inputs.platforms == 'macos'
    needs: [release-plan, lint]
    runs-on: macos-15 # Xcode 16 (Apple clang 16): the C++20 features the code uses; the app still targets macOS 11
    timeout-minutes: 45
    env:
      SAWGOD_RELEASE_VERSION: ${{ needs.release-plan.outputs.build_version || (needs.release-plan.outputs.release != 'true' && inputs.label) || '' }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/requirements.txt

      - name: Check Apple Silicon runner and install build tools
        run: |
          test "$(uname -m)" = arm64
          brew install ninja
          python -m pip install -r tools/requirements.txt

      - name: Cache pinned dependencies and release sources
        uses: actions/cache@v6.1.0
        with:
          path: |
            build/package-macos/_deps
            ref/fluidsynth/*.tar.gz
            ref/fluidsynth/*.zip
            ref/soundfonts/GeneralUser-GS.sf2
          key: macos-arm64-deps-${{ hashFiles('CMakeLists.txt', 'tests/CMakeLists.txt', 'tools/release/build_fluidsynth.sh', 'tools/release/fetch_soundfont.py') }}

      - name: Fetch redistributable soundfont
        if: needs.release-plan.outputs.flavor == 'sawgod'
        run: python tools/release/fetch_soundfont.py

      - name: Configure release with tests
        run: nice cmake --preset macos-release -B build/package-macos -DSAWGOD_ENGLISH_FILL= -DSAWGOD_DEV_SOUNDFONT=

      - name: Build
        run: nice cmake --build build/package-macos --parallel 4

      - name: Test (no ROM)
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: nice ctest --test-dir build/package-macos --output-on-failure --parallel 4

      - name: Package and verify ad-hoc signature
        run: nice tools/package.sh macos "${{ needs.release-plan.outputs.flavor }}"

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: sawgod-macos-arm64
          path: |
            dist/${{ needs.release-plan.outputs.flavor == 'vanilla' && 'sawgod-vanilla' || 'sawgod' }}-macos-arm64.zip
            dist/${{ needs.release-plan.outputs.flavor == 'vanilla' && 'sawgod-vanilla' || 'sawgod' }}-macos-arm64.zip.sha256
          if-no-files-found: error
          retention-days: 14

  android:
    needs: release-plan
    if: needs.release-plan.outputs.flavor != 'vanilla' && (inputs.platforms == '' || inputs.platforms == 'all' || inputs.platforms == 'android')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      SAWGOD_RELEASE_VERSION: ${{ needs.release-plan.outputs.build_version || (needs.release-plan.outputs.release != 'true' && inputs.label) || '' }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/requirements.txt
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '14742923'
          packages: platform-tools
      - name: Cache pinned SDK and redistributable sources
        uses: actions/cache@v6.1.0
        with:
          path: |
            ${{ env.ANDROID_HOME }}/platforms/android-36
            ${{ env.ANDROID_HOME }}/build-tools/37.0.0
            ${{ env.ANDROID_HOME }}/ndk/29.0.14206865
            ${{ env.ANDROID_HOME }}/cmake/4.1.2
            ref/deps
            ref/fluidsynth/*.tar.gz
            ref/fluidsynth/*.zip
            ref/soundfonts/GeneralUser-GS.sf2
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: android-r29-api36-bt37-cmake412-${{ hashFiles('CMakeLists.txt', 'android/**/*.gradle', 'android/gradle/wrapper/gradle-wrapper.properties', 'tools/release/fetch_sources.py', 'tools/release/build_fluidsynth.sh', 'tools/release/fetch_soundfont.py') }}
      - name: Install pinned SDK packages
        run: |
          sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;37.0.0' 'ndk;29.0.14206865' 'cmake;4.1.2'
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> "$GITHUB_ENV"
      - name: Prepare redistributable inputs
        run: |
          python -m pip install -r tools/requirements.txt
          nice python tools/release/fetch_sources.py
          python tools/release/fetch_soundfont.py
      # The release key only signs release builds; every other build gets the public debug key.
      - name: Package Android (release variant, optional release key)
        env:
          KEYSTORE_BASE64: ${{ needs.release-plan.outputs.release == 'true' && secrets.SAWGOD_ANDROID_KEYSTORE_BASE64 || '' }}
          STORE_PASSWORD: ${{ needs.release-plan.outputs.release == 'true' && secrets.SAWGOD_ANDROID_STORE_PASSWORD || '' }}
          KEY_ALIAS: ${{ needs.release-plan.outputs.release == 'true' && secrets.SAWGOD_ANDROID_KEY_ALIAS || '' }}
          KEY_PASSWORD: ${{ needs.release-plan.outputs.release == 'true' && secrets.SAWGOD_ANDROID_KEY_PASSWORD || '' }}
        run: |
          set -euo pipefail
          trap 'rm -f "$RUNNER_TEMP/sawgod-release.jks"' EXIT
          if [[ -n "$KEYSTORE_BASE64$STORE_PASSWORD$KEY_ALIAS$KEY_PASSWORD" ]]; then
            test -n "$KEYSTORE_BASE64" && test -n "$STORE_PASSWORD" && test -n "$KEY_ALIAS" && test -n "$KEY_PASSWORD"
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/sawgod-release.jks"
            chmod 600 "$RUNNER_TEMP/sawgod-release.jks"
            export SAWGOD_ANDROID_KEYSTORE="$RUNNER_TEMP/sawgod-release.jks"
            export SAWGOD_ANDROID_STORE_PASSWORD="$STORE_PASSWORD"
            export SAWGOD_ANDROID_KEY_ALIAS="$KEY_ALIAS"
            export SAWGOD_ANDROID_KEY_PASSWORD="$KEY_PASSWORD"
            signing='Android APK: release-key signed.'
          else
            signing='Android APK: TESTING BUILD, signed with the public debug key; not a production signature.'
          fi
          SAWGOD_ANDROID_VARIANT=release nice tools/package.sh android sawgod
          printf '%s\n' "$signing" > dist/android-signing.txt
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: sawgod-android-arm64-v8a
          path: |
            dist/sawgod-android-arm64-v8a-release.apk
            dist/sawgod-android-arm64-v8a-release.apk.sha256
            dist/android-signing.txt
          if-no-files-found: error
          retention-days: 14

  draft-release:
    needs: [release-plan, lint, build-test, windows-mingw-cross, macos, android]
    # A vanilla release deliberately skips Android; all required builds must still pass.
    if: >-
      always() && needs.release-plan.outputs.release == 'true' &&
      needs.lint.result == 'success' && needs.build-test.result == 'success' &&
      needs.windows-mingw-cross.result == 'success' && needs.macos.result == 'success' &&
      (needs.android.result == 'success' ||
       (needs.release-plan.outputs.flavor == 'vanilla' && needs.android.result == 'skipped'))
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8
        with:
          pattern: sawgod-*
          path: dist
          merge-multiple: true
      # Hard gate: every package passes the name scan (package.sh scans too).
      - name: Name scan of every final package
        run: python3 tools/name_scan.py dist
      - name: Audit artifacts and create or refresh draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.release-plan.outputs.version }}
        run: python3 tools/release/draft_release.py dist

  lint:
    needs: release-plan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/requirements.txt

      - name: Install lint and tool requirements
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format-18
          python -m pip install -r tools/requirements.txt

      - name: clang-format check (handwritten C/C++)
        run: |
          find src tests \( -name '*.cpp' -o -name '*.h' \) ! -name '*.generated.h' -print0 | xargs -0 clang-format-18 --dry-run --Werror

      - name: Embedded shader check (all formats, including Metal)
        run: python tools/compile_shaders.py --all --check

      - name: ROM-leak scan
        run: python tools/leakscan.py

      - name: Package notice inventory
        run: |
          python tools/release/check_notices.py
          python tools/release/test_release.py

